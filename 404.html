<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flickzit</title>
  <script>
    (function () {
      var path = window.location.pathname;
      if (path.indexOf('/s/') === 0) {
        window.location.replace('https://apps.apple.com/app/flickzit/id6482294334');
      }
    })();
  </script>
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
      text-align: center;
    }
    .container {
      padding: 40px;
    }
    h1 {
      font-size: 48px;
      color: #ff69b4;
      margin-bottom: 16px;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    a {
      color: #ff69b4;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page Not Found</h1>
    <p>Sorry, the page you're looking for doesn't exist.</p>
    <p><a href="/">Go back to Flickzit</a></p>
  </div>
</body>
</html>
