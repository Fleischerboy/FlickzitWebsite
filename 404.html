<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flickzit</title>
  <script>
    (function () {
      var path = window.location.pathname;
      if (path.indexOf('/s/') !== 0) {
        document.getElementById('message').textContent = 'Page not found.';
        return;
      }
      var payload = path.substring(3);
      window.location.href = 'myworkoutflixit://s/' + payload;
      document.getElementById('message').textContent =
        "Don't have Flickzit yet? Download it to view shared drills.";
      document.getElementById('store-link').style.display = 'inline-block';
    })();
  </script>
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
      text-align: center;
    }
    .container {
      padding: 40px;
    }
    h1 {
      font-size: 48px;
      color: #ff69b4;
      margin-bottom: 16px;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    a {
      color: #ff69b4;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Flickzit</h1>
    <p id="message">Opening Flickzit…</p>
    <p><a id="store-link" href="https://apps.apple.com/app/flickzit/id6482294334" style="display:none;">Download on the App Store</a></p>
    <p><a href="/">Go back to Flickzit</a></p>
  </div>
</body>
</html>
