<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flickzit</title>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var path = window.location.pathname;
        if (path.indexOf("/s/") !== 0) {
          document.getElementById("message").textContent = "Page not found.";
          return;
        }
        document.getElementById("message").textContent =
          "Don't have Flickzit yet? Download it to view shared drills.";
        document.getElementById("store-link").style.display = "inline-flex";
        var payload = path.substring(3);
        window.location.href = "myworkoutflixit://s/" + payload;
      });
    </script>
    <style>
      body {
        font-family: "Open Sans", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
        color: #333;
        text-align: center;
      }
      .container {
        padding: 40px 24px;
        max-width: 480px;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        font-size: 48px;
        color: #ff69b4;
        margin-bottom: 16px;
      }
      p {
        font-size: 18px;
        color: #555;
      }
      a {
        color: #ff69b4;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      .store-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background-color: #ff69b4;
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 12px;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(255, 105, 180, 0.35);
        transition:
          background-color 0.2s,
          box-shadow 0.2s,
          transform 0.15s;
        margin-top: 8px;
        width: auto;
        max-width: 100%;
        box-sizing: border-box;
      }
      .store-btn:hover {
        background-color: #ff85c2;
        text-decoration: none;
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(255, 105, 180, 0.45);
      }
      .store-btn:active {
        transform: scale(0.97);
      }
      .store-btn svg {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
      }
      @media (max-width: 480px) {
        h1 {
          font-size: 36px;
        }
        p {
          font-size: 16px;
        }
        .store-btn {
          font-size: 15px;
          padding: 12px 22px;
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Flickzit</h1>
      <p id="message">Opening Flickzit…</p>
      <p>
        <a
          id="store-link"
          class="store-btn"
          href="https://apps.apple.com/app/flickzit/id6482294334"
          style="display: none"
          ><svg viewBox="0 0 384 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184 4 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg> Download on the App Store</
        >
      </p>
      <p><a href="/">Go back to Flickzit</a></p>
    </div>
  </body>
</html>
